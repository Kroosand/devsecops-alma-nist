# ==============================================================================
# CONFIGURACIÓN DE BASTIONADO PARA NGINX / OPELITESPEED
# Empresa: Alma Industria Creativa E.I.R.L.
# Proyecto: Titulación SENATI - DevSecOps NIST CSF v2.0
# Control: SOP-03 (PR.IR-01 / PR.PT-01)
# ==============================================================================

# 1. Definición de Rate Limiting y Mapeo de Bots Confiables (OpenGraph)
map $http_user_agent $limit_bots {
    default                    $binary_remote_addr;
    ~*(facebookexternalhit)    "";
    ~*(Facebot)                "";
    ~*(Twitterbot)             "";
    ~*(LinkedInBot)            "";
    ~*(WhatsApp)               "";
    ~*(TelegramBot)            "";
    ~*(Googlebot)              "";
    ~*(bingbot)                "";
}

# Zona de limitación de tasa: 10 peticiones/segundo para usuarios normales
limit_req_zone $limit_bots zone=one:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name almaindustriacreativa.com www.almaindustriacreativa.com;

    # 2. Cabeceras HTTP de Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https:;" always;

    # Ocultar versión de Nginx
    server_tokens off;

    # 3. Bloqueo de Enumeración REST API de Usuarios (/wp-json/wp/v2/users)
    location ~* ^/wp-json/wp/v2/users {
        # Si no hay token de autenticación ni cookie de sesión, retornar 403 Forbidden
        if ($http_authorization = "") {
            return 403 '{"code":"rest_forbidden","message":"El acceso al endpoint de usuarios esta restringido.","data":{"status":403}}';
        }
        try_files $uri $uri/ /index.php?$args;
    }

    # 4. Bloqueo de enumeración por author query string (?author=1)
    if ($arg_author ~ "^[0-9]+") {
        return 403;
    }

    # 5. Aplicación de Rate Limiting con Excepción para Bots OpenGraph
    location / {
        limit_req zone=one burst=20 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    # 6. Denegar acceso a archivos sensibles
    location ~* \.(env|git|htaccess|htpasswd|json|sql|log)$ {
        deny all;
    }
}
